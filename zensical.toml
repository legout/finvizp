# finvizp user documentation, built with Zensical.
# The Markdown tree follows Diataxis: tutorials, how-to, reference, explanation.

[project]
site_name = "finvizp"
site_url = "https://legout.github.io/finvizp/"
docs_dir = "docs/user"
site_dir = "docs/user/site"
language = "en"
extra_css = ["stylesheets/extra.css"]
nav = [
  "index.md",
  { "Tutorials" = [
    { "Get started" = "tutorials/get-started.md" },
    { "First data: symbols & quotes" = "tutorials/symbols-and-quotes.md" },
  ] },
  { "How-to guides" = [
    { "Use the sync API" = "how-to/sync-api.md" },
    { "Configure proxies & cache" = "how-to/proxies-and-cache.md" },
    { "Keep your own history" = "how-to/caller-owned-history.md" },
    { "Migrate from finvizfinance" = "how-to/migrate-from-finvizfinance.md" },
    { "Run live smokes" = "how-to/live-smokes-and-drift.md" },
  ] },
  { "Reference" = [
    { "API: client & contracts" = "reference/api.md" },
    { "API: core operations" = "reference/api-core-operations.md" },
    { "API: analysis operations" = "reference/api-analysis-operations.md" },
    { "API: market operations" = "reference/api-market-operations.md" },
    { "Result envelopes" = "reference/results.md" },
    { "Arrow schemas" = "reference/schemas-0.1.md" },
    { "Schema versioning" = "reference/schema-versioning.md" },
    { "Screener" = "reference/screener.md" },
    { "Screener registry" = "reference/screener-registry.md" },
    { "Groups, maps & events" = "reference/groups-maps-events.md" },
    { "Markets & artifacts" = "reference/markets-and-artifacts.md" },
    { "Capability matrix" = "reference/capability-matrix.md" },
  ] },
  { "Explanation" = [
    { "Access & responsible use" = "explanation/access-and-responsible-use.md" },
  ] },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false

[project.theme]
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "toc.follow",
]
